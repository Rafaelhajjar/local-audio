name: Build and test
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  macos:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Source and dependency integrity
        run: python3 scripts/check-source.py --tracked
      - name: Swift toolchain
        run: swift --version
      - name: Tests (generated fixtures, no models or microphone)
        run: swift test --scratch-path .build/tests
      - name: Package Apple silicon app
        run: ./scripts/build-app.sh
      - uses: actions/upload-artifact@v4
        with:
          name: LocalAudio-development-preview
          path: |
            dist/LocalAudio-*.zip
            dist/SHA256SUMS.txt
